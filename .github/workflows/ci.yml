name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, e2e, accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets: the database tests run on embedded Postgres (PGlite), the race
    # tests on the throwaway service below, and the browser suites run the built
    # app in demo mode on a fresh in-memory store.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_CHANNEL: chromium
      E2E_OUT: artifacts/e2e
      A11Y_OUT: artifacts/a11y
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck, lint, unit + database tests, production build
      - run: npm run check
      - name: Type-check the mobile app
        run: npm run typecheck --workspace @findmaxxing/mobile

      - name: Export the mobile web bundle (not native sign-off)
        run: npm run export:web --workspace @findmaxxing/mobile

      - name: Install the Playwright browser
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end suite
        run: npm run e2e

      - name: Accessibility (axe-core)
        run: npm run a11y

      - name: Onboarding and first-map flows
        env:
          ONBOARDING_E2E_OUT: artifacts/e2e-onboarding
        run: npm run e2e:onboarding

      - name: Event detail flows
        env:
          EVENT_DETAIL_E2E_OUT: artifacts/e2e-event-detail
        run: npm run e2e:event-detail

      - name: Build feature-enabled demo for release smoke tests
        env:
          NEXT_PUBLIC_FEATURES: messaging,notifications,payments,ads,admin,reputation,recommendations,pwa
        run: npm run build

      - name: Feature-enabled demo flows (no real services)
        env:
          FEATURE_E2E_OUT: artifacts/e2e-features
        run: npm run e2e:features

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runs
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
